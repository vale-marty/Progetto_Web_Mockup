<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock N' Bass | Negozio di Bassi</title>
    <link rel="icon" type="image/png" href="assets/images/logo/logo_nav.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container-fluid px-4">
                
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo/logo_nav.png" alt="Logo" height="50">
                </a>

                <div class="d-flex align-items-center order-lg-3">
                    <a href="login.html" id="navAccountIcon" class="text-danger mx-2"><i class="bi bi-person fs-4"></i></a>
                    <a href="carrello.html" class="text-white mx-2 position-relative">
                        <i class="bi bi-cart fs-4"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; display: none;">
                            0
                        </span>
                    </a>
                    
                    <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRock">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse order-lg-2" id="navbarRock">
                    <ul class="navbar-nav mx-auto text-start text-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="scuole.html">SCUOLE</a></li>
                        <li class="nav-item"><a class="nav-link" href="prodotti.html">PRODOTTI</a></li>
                        <li class="nav-item"><a class="nav-link" href="contatti.html">CONTATTI</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="pt-5 mt-5 min-vh-100 reg-page d-flex align-items-center justify-content-center min-vh-100 bg-dark py-4 px-2">
        <div class="reg-card p-4 p-md-5 rounded shadow-lg ">
            <div class="text-center mb-4">
                <img src="assets/images/logo/logo_completo.png" alt="logo" class="mb-4 logo-form">
                <h2 class="text-danger fw-bold">SCEGLI IL TUO  <span class="text-white">PROSSIMO BASSO</span></h2>
                <p class="text-white">Registrati ora</p>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <button type="button" id="btnPrivato" class="btn btn-outline-danger w-100 py-3" onclick="selectProfile('privato')">
                        <i class="bi bi-person-fill d-block fs-3"></i>
                        PRIVATO
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" id="btnScuola" class="btn btn-outline-danger w-100 py-3" onclick="selectProfile('scuola')">
                        <i class="bi bi-mortarboard-fill d-block fs-3"></i>
                        SCUOLA 
                    </button>
                </div>
            </div>

            <form id="registerForm">
                <input type="hidden" id="userType" value="privato">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="text-white-50 small mb-2">Nome Completo</label>
                        <input type="text" id="regNome" class="form-control bg-dark border-secondary text-white" required placeholder="Mario Rossi">
                    </div>
                    <div class="col-md-6">
                        <label class="text-white-50 small mb-2">Username</label>
                        <input type="text" id="regUsername" class="form-control bg-dark border-secondary text-white" required placeholder="rockstar99">
                    </div>

                    <div id="extraFields" class="row g-3 mx-0 px-0 d-none">
                        <div class="col-12 mt-3">
                            <label class="text-danger small mb-2 fw-bold">DETTAGLI SCUOLA</label>
                        </div>
                        <div class="col-md-8">
                            <label class="text-white-50 small mb-2">Ragione Sociale / Nome Scuola</label>
                            <input type="text" id="regScuolaNome" class="form-control bg-dark border-secondary text-white" placeholder="Accademia del Basso">
                        </div>
                        <div class="col-md-4">
                            <label class="text-white-50 small mb-2">Partita IVA</label>
                            <input type="text" id="regPiva" class="form-control bg-dark border-secondary text-white" placeholder="12345678901">
                        </div>
                        <div class="col-12">
                            <label class="text-white-50 small mb-2">Sede Legale (Città, Indirizzo)</label>
                            <input type="text" id="regSede" class="form-control bg-dark border-secondary text-white" placeholder="Milano, Via delle Note 12">
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="text-white-50 small mb-2">Email</label>
                        <input type="email" id="regEmail" class="form-control bg-dark border-secondary text-white" required placeholder="mail@esempio.it">
                    </div>
                    <div class="col-md-6">
                        <label class="text-white-50 small mb-2">Password</label>
                        <input type="password" id="regPass" class="form-control bg-dark border-secondary text-white" required placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="text-white-50 small mb-2">Conferma Password</label>
                        <input type="password" id="regPassConf" class="form-control bg-dark border-secondary text-white" required placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-danger w-100 py-3 mt-4 mb-3  ">CREA ACCOUNT</button>
                
                <div class="text-center">
                    <p class="text-white-50 small">Hai già un account? <a href="login.html" class="text-danger fw-bold text-decoration-none">Accedi qui</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer-section pt-5 pb-3">
        <div class="container ">
            <div class="d-flex align-items-center justify-content-center text-center footer-links mx-auto">
                <a href="index.html">home</a>
                <a href="scuole.html">scuola</a>
                <a href="prodotti.html">prodotti</a>
                <a href="contatti.html">contatti</a>

            </div>

            <hr class="mt-3 mb-4 border-secondary">

            <div class="row">
                <div class="col-12 text-center">
                    <p class="text-white-50 mb-0 small">&copy; 2026 ROCK N' BASS. All Rights Reserved. Created with Passion.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/registrazione.js"></script>
    <script src="js/main.js"></script>
    <!--script per modificare l'allert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
