<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container-fluid px-4">
                
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo/logo_nav.png" alt="Logo" height="50">
                </a>

                <div class="d-flex align-items-center order-lg-3">
                    <a href="login.html" id="navAccountIcon" class="text-danger mx-2"><i class="bi bi-person fs-4"></i></a>
                    <a href="carrello.html" class="text-white mx-2 position-relative">
                        <i class="bi bi-cart fs-4"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; display: none;">
                            0
                        </span>
                    </a>
                    
                    <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRock">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse order-lg-2" id="navbarRock">
                    <ul class="navbar-nav mx-auto text-start text-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="scuole.html">SCUOLE</a></li>
                        <li class="nav-item"><a class="nav-link" href="prodotti.html">PRODOTTI</a></li>
                        <li class="nav-item"><a class="nav-link" href="contatti.html">CONTATTI</a></li>
                    </ul>
                </div>
            </div>
        </nav>

    <main class="login-page d-flex align-items-center justify-content-center min-vh-100 bg-dark">
        <div class="login-card p-4 p-md-5 rounded shadow-lg bg-light">
            <div class="text-center mb-4">
                <img src="assets/images/logo/logo_completo.png" alt="Logo" width="80" class="mb-3">
                <h2 class="text-danger fw-bold">BENTORNATO </h2>
                <p class="text-white">Inserisci le tue credenziali per accedere</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="text-white-50 small mb-2">Username</label>
                    <input type="text" id="username" class="form-control bg-dark border-secondary text-white p-3" placeholder="username" required>
                </div>
                <div class="mb-4">
                    <label class="text-white-50 small mb-2">Password</label>
                    <input type="password" id="password" class="form-control bg-dark border-secondary text-white p-3" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-danger w-100 py-3  mb-3">ACCEDI</button>
                
                <div class="text-center">
                    <a href="#" onclick="mostraRecupero()" class="text-white-50 small text-decoration-none">Password dimenticata?</a>
                    <hr class="border-secondary my-4">
                    <p class="text-white-50">Non hai un account? <a href="registrazione.html" class="text-danger fw-bold text-decoration-none">Registrati ora</a></p>
                </div>
            </form>
        </div>
